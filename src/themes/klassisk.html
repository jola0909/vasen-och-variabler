<title>Väsen &amp; Variabler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ett matematikäventyr för åk 7–9 med nordiska väsen att samla.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700;800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Layout: en spelskärm i taget, centrerad kolumn (max 980px) under en fast toppbar; nordisk natt med norrsken. */
:root {
  --night: #0c1618;
  --pine: #13252a;
  --pine2: #1a3238;
  --pine3: #234046;
  --line: #2d4c50;
  --birch: #ece6d6;
  --mute: #9db2ac;
  --aurora: #5fe3b3;
  --aurora-ink: #072a1f;
  --frost: #7cc7ff;
  --ember: #f3b54a;
  --berry: #ec5670;
  --heath: #b48cff;
  --r-c: #a9b8b2;
  --r-r: #6fb8ff;
  --r-e: #b48cff;
  --r-l: #f3b54a;
  --display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --body: "Lexend", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  color: var(--birch);
  background:
    radial-gradient(120% 60% at 15% -10%, rgba(95, 227, 179, .16), transparent 60%),
    radial-gradient(90% 50% at 95% -5%, rgba(124, 199, 255, .12), transparent 55%),
    radial-gradient(80% 40% at 60% 0%, rgba(180, 140, 255, .08), transparent 60%),
    var(--night);
  background-attachment: fixed;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--frost); outline-offset: 2px; }
.forest { position: fixed; inset: auto 0 0 0; height: 160px; pointer-events: none; z-index: 0; opacity: .55; }
.forest svg { width: 100%; height: 100%; display: block; }
.stars-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

#app { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px; }

/* ---------- Toppbar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; padding-block: 10px; margin-bottom: 14px; background: linear-gradient(var(--night) 70%, rgba(12, 22, 24, 0)); flex-wrap: wrap; }
.brand { background: none; border: 0; padding: 0; font-family: var(--display); font-size: 28px; font-weight: 800; letter-spacing: .5px; color: var(--birch); line-height: 1; }
.brand span { color: var(--aurora); }
.stats { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--pine); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip.gold b { color: var(--ember); }
.chip.star b { color: var(--ember); }
.lvlchip { display: flex; align-items: center; gap: 8px; background: var(--pine); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 4px; }
.lvlchip .badge { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--aurora); color: var(--aurora-ink); font-weight: 700; font-size: 14px; }
.lvlchip .xp { width: 74px; height: 6px; background: var(--pine3); border-radius: 4px; overflow: hidden; }
.lvlchip .xp i { display: block; height: 100%; background: linear-gradient(90deg, var(--aurora), var(--frost)); }
.lvlchip small { color: var(--mute); font-size: 11px; letter-spacing: .3px; display: block; line-height: 1.1; }
.iconbtn { background: var(--pine); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; display: grid; place-items: center; padding: 0; font-size: 15px; }
.cloud { font-size: 12px; color: var(--mute); }

/* ---------- Typografi & knappar ---------- */
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .3px; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(34px, 7vw, 52px); }
h2 { font-size: clamp(26px, 5vw, 34px); }
h3 { font-size: 22px; }
.eyebrow { text-transform: uppercase; letter-spacing: 1.6px; font-size: 11px; color: var(--mute); font-weight: 600; }
.muted { color: var(--mute); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; background: var(--pine3); color: var(--birch); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .25); transition: transform .08s, filter .15s; }
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .25); }
.btn.primary { background: var(--aurora); color: var(--aurora-ink); }
.btn.gold { background: var(--ember); color: #2e1d00; }
.btn.ghost { background: transparent; border: 1px solid var(--line); box-shadow: none; }
.btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: rgba(19, 37, 42, .86); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; backdrop-filter: blur(4px); }
.stack { display: grid; gap: 16px; }
.back { background: none; border: 0; color: var(--mute); padding: 4px 0; font-weight: 600; justify-self: start; }
.back:hover { color: var(--birch); }
.screenhead { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }

/* ---------- Start / setup ---------- */
.hero { text-align: center; padding-block: 24px 8px; }
.hero h1 span { color: var(--aurora); }
.hero p { max-width: 54ch; margin: 10px auto 0; color: var(--mute); }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grade { border: 2px solid var(--line); background: var(--pine); border-radius: 14px; padding: 14px 8px; text-align: center; }
.grade b { display: block; font-family: var(--display); font-size: 30px; }
.grade.sel { border-color: var(--aurora); background: var(--pine2); box-shadow: 0 0 0 4px rgba(95, 227, 179, .15); }
.field { width: 100%; background: var(--night); border: 1px solid var(--line); color: var(--birch); border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 16px; }
.starters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* ---------- Hub ---------- */
.hubgrid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.continue { position: relative; overflow: hidden; display: grid; gap: 8px; padding: 22px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(135deg, rgba(95, 227, 179, .18), rgba(124, 199, 255, .06) 60%), var(--pine); }
.continue .big { position: absolute; right: 14px; bottom: -10px; font-size: 110px; opacity: .9; filter: drop-shadow(0 8px 20px rgba(0, 0, 0, .5)); }
.continue h2 { max-width: 14ch; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { position: relative; background: var(--pine); border: 1px solid var(--line); border-radius: 14px; padding: 14px 10px; text-align: center; display: grid; gap: 4px; justify-items: center; transition: transform .1s, border-color .15s; }
.tile:hover { transform: translateY(-2px); border-color: var(--aurora); }
.tile .ic { font-size: 30px; line-height: 1; }
.tile b { font-weight: 600; font-size: 14px; }
.tile small { color: var(--mute); font-size: 11px; line-height: 1.2; }
.tile.locked { opacity: .5; }
.dot { position: absolute; top: 6px; right: 8px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--berry); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 5px; }
.quest { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.quest:first-of-type { border-top: 0; }
.quest .bar { grid-column: 1 / -1; height: 6px; background: var(--pine3); border-radius: 4px; overflow: hidden; }
.quest .bar i { display: block; height: 100%; background: var(--ember); }
.quest.done .bar i { background: var(--aurora); }
.teamrow { display: flex; gap: 8px; }
.mini { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; background: var(--pine2); border: 2px solid var(--line); }
.mini.empty { color: var(--mute); font-size: 14px; border-style: dashed; }

/* ---------- Karta ---------- */
.wtabs { display: flex; gap: 8px; flex-wrap: wrap; }
.wtab { border: 1px solid var(--line); background: var(--pine); border-radius: 999px; padding: 8px 14px; font-weight: 600; }
.wtab.sel { background: var(--birch); color: var(--night); }
.wtab.locked { opacity: .5; }
.worldhead { border-radius: 18px; padding: 18px; border: 1px solid var(--line); display: grid; gap: 6px; }
.map { position: relative; margin: 6px auto 0; max-width: 520px; }
.map svg.path { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 2px; background: none; border: 0; padding: 0; }
.node .disc { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; background: var(--pine2); border: 3px solid var(--line); box-shadow: 0 6px 0 rgba(0, 0, 0, .35); transition: transform .12s; }
.node:hover .disc { transform: scale(1.07); }
.node.open .disc { border-color: var(--aurora); }
.node.next .disc { animation: pulse 1.6s infinite; }
.node.boss .disc { width: 78px; height: 78px; font-size: 38px; border-color: var(--ember); }
.node.locked .disc { filter: grayscale(1) brightness(.6); }
.node .nm { font-size: 12px; font-weight: 600; background: rgba(12, 22, 24, .85); padding: 1px 8px; border-radius: 8px; white-space: nowrap; }
.node .st { font-size: 13px; letter-spacing: 1px; color: var(--ember); line-height: 1; }
.node .st .off { color: var(--pine3); }
@keyframes pulse { 0%, 100% { box-shadow: 0 6px 0 rgba(0, 0, 0, .35), 0 0 0 0 rgba(95, 227, 179, .55); } 50% { box-shadow: 0 6px 0 rgba(0, 0, 0, .35), 0 0 0 12px rgba(95, 227, 179, 0); } }
.milestones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ms { background: var(--pine); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; font-size: 13px; display: grid; gap: 4px; justify-items: center; }
.ms .ic { font-size: 24px; }
.ms.claimable { border-color: var(--ember); box-shadow: 0 0 0 3px rgba(243, 181, 74, .2); }
.ms.claimed { opacity: .5; }

/* ---------- Strid ---------- */
.arena { display: grid; gap: 12px; }
.foe { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 18px; border: 1px solid var(--line); background: radial-gradient(120% 140% at 0% 50%, rgba(236, 86, 112, .14), transparent 60%), var(--pine); }
.foe .face { font-size: 72px; line-height: 1; width: 92px; text-align: center; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .55)); animation: bob 2.4s ease-in-out infinite; }
.foe.boss .face { font-size: 92px; width: 110px; }
.foe .face.hit { animation: hit .35s; }
.foe .face.lunge { animation: lunge .4s; }
.foe .face.dead { animation: die .7s forwards; }
@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes hit { 20% { transform: translateX(10px) rotate(6deg); filter: brightness(2) drop-shadow(0 0 12px #fff); } 60% { transform: translateX(-6px); } }
@keyframes lunge { 40% { transform: translateY(14px) scale(1.18); } }
@keyframes die { to { transform: scale(.2) rotate(40deg); opacity: 0; } }
.hpbar { height: 14px; background: var(--night); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--berry), #ff8a6a); transition: width .35s; }
.hpbar .ghost { background: rgba(255, 255, 255, .35); transition: width .9s .25s; }
.phases { display: flex; gap: 4px; }
.phases span { width: 10px; height: 10px; border-radius: 50%; background: var(--pine3); }
.phases span.on { background: var(--ember); }
.me { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.hearts { font-size: 22px; letter-spacing: 2px; line-height: 1; white-space: nowrap; }
.hearts .lost { filter: grayscale(1); opacity: .3; }
.hearts .sh { font-size: 18px; }
.combo { font-weight: 700; color: var(--ember); font-variant-numeric: tabular-nums; min-width: 92px; }
.combo.hot { text-shadow: 0 0 12px rgba(243, 181, 74, .8); }
.timer { height: 8px; border-radius: 6px; background: var(--pine3); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--aurora); width: 100%; }
.timer i.warn { background: var(--ember); }
.timer i.crit { background: var(--berry); }
.qcard { background: var(--birch); color: #13252a; border-radius: 18px; padding: 18px 20px; display: grid; gap: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
.qcard .topic { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: #4e6a64; display: flex; justify-content: space-between; gap: 8px; }
.qtext { font-size: clamp(19px, 3.6vw, 26px); font-weight: 600; line-height: 1.35; text-wrap: balance; }
.qtext.long { font-size: clamp(16px, 2.8vw, 20px); }
.fig { max-width: 100%; height: auto; justify-self: center; }
.fig .shape { fill: rgba(95, 227, 179, .25); stroke: #13252a; stroke-width: 2; }
.fig .shape.s2 { fill: rgba(95, 227, 179, .4); }
.fig .shape.s3 { fill: rgba(95, 227, 179, .55); }
.fig .ra { fill: none; stroke: #13252a; stroke-width: 1.5; }
.fig .dash, .fig .edge { stroke: #13252a; stroke-width: 1.5; stroke-dasharray: 4 3; }
.fig .edge { stroke-dasharray: none; stroke-width: 2; }
.fig .dot { fill: #13252a; }
.fig text { font: 600 13px var(--body); fill: #13252a; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.05; font-size: .82em; margin: 0 .1em; }
.fr i { font-style: normal; padding: 0 .15em; }
.fr i:first-child { border-bottom: 2px solid currentColor; }
.sys { display: inline-grid; gap: 2px; border-left: 3px solid currentColor; padding-left: 10px; margin-top: 6px; font-size: .95em; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ans { min-height: 64px; border-radius: 14px; border: 2px solid var(--line); background: var(--pine2); font-size: clamp(16px, 3.2vw, 21px); font-weight: 600; padding: 10px; box-shadow: 0 5px 0 rgba(0, 0, 0, .35); transition: transform .08s, border-color .12s; }
.ans:hover { border-color: var(--aurora); }
.ans:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
.ans.right { background: var(--aurora); color: var(--aurora-ink); border-color: var(--aurora); }
.ans.wrong { background: var(--berry); color: #fff; border-color: var(--berry); }
.ans.gone { opacity: .2; pointer-events: none; }
.ans kbd { font: 600 11px var(--body); color: var(--mute); display: block; }
.writebox { display: flex; gap: 10px; }
.writebox .field { font-size: 22px; font-weight: 600; text-align: center; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.toggle { border: 1px dashed var(--ember); background: rgba(243, 181, 74, .08); color: var(--ember); border-radius: 10px; padding: 7px 12px; font-weight: 600; font-size: 13px; }
.toggle.on { background: var(--ember); color: #2e1d00; border-style: solid; }
.explain { background: var(--pine); border: 1px solid var(--line); border-left: 4px solid var(--berry); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; }
.explain.good { border-left-color: var(--aurora); }
.explain ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.explain .right { font-size: 20px; font-weight: 700; color: var(--aurora); }
.float { position: fixed; pointer-events: none; z-index: 60; font-weight: 800; font-size: 30px; color: var(--ember); text-shadow: 0 3px 0 rgba(0, 0, 0, .6); animation: floatUp 1.1s forwards; }
.float.crit { color: #fff; font-size: 38px; }
@keyframes floatUp { 0% { transform: translate(-50%, 0) scale(.6); opacity: 0; } 15% { transform: translate(-50%, -10px) scale(1.15); opacity: 1; } 100% { transform: translate(-50%, -80px) scale(1); opacity: 0; } }
.bolt { position: fixed; z-index: 55; pointer-events: none; font-size: 28px; transition: transform .38s cubic-bezier(.4, .1, .6, 1), opacity .38s; filter: drop-shadow(0 0 10px var(--aurora)); }
.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
.flash { position: fixed; inset: 0; pointer-events: none; z-index: 50; background: rgba(236, 86, 112, .25); animation: fade .45s forwards; }
@keyframes fade { to { opacity: 0; } }
.banner { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); z-index: 70; pointer-events: none; text-align: center; font-family: var(--display); font-size: clamp(34px, 8vw, 64px); font-weight: 800; color: var(--ember); text-shadow: 0 4px 0 rgba(0, 0, 0, .6), 0 0 30px rgba(243, 181, 74, .5); animation: bannerIn 1.8s forwards; white-space: nowrap; }
.banner small { display: block; font-family: var(--body); font-size: 16px; color: var(--birch); font-weight: 600; text-shadow: 0 2px 0 rgba(0, 0, 0, .6); }
@keyframes bannerIn { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 15% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate(-50%, -60%) scale(1); opacity: 0; } }

/* ---------- Våg ---------- */
.scale { position: relative; height: 210px; margin-top: 4px; }
.scale .post { position: absolute; left: 50%; bottom: 0; width: 14px; height: 150px; transform: translateX(-50%); background: linear-gradient(var(--ember), #a8762a); border-radius: 6px 6px 0 0; }
.scale .base { position: absolute; left: 50%; bottom: 0; width: 140px; height: 16px; transform: translateX(-50%); background: #a8762a; border-radius: 8px 8px 0 0; }
.scale .beam { position: absolute; left: 6%; right: 6%; top: 52px; height: 10px; background: var(--ember); border-radius: 6px; transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); }
.scale .pan { position: absolute; top: 62px; width: 42%; display: grid; justify-items: center; }
.scale .pan.l { left: 0; }
.scale .pan.r { right: 0; }
.scale .pan .rope { width: 60%; height: 28px; border-left: 2px solid var(--mute); border-right: 2px solid var(--mute); }
.scale .pan .dish { min-width: 80%; padding: 10px 10px 14px; background: var(--pine2); border: 2px solid var(--ember); border-radius: 0 0 50% 50% / 0 0 40% 40%; text-align: center; font-size: clamp(20px, 4.4vw, 30px); font-weight: 700; }
.scale .pan.bump .dish { animation: bump .4s; }
@keyframes bump { 40% { transform: translateY(8px); } }
.ops { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.op { min-width: 74px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--pine2); font-size: 18px; font-weight: 700; box-shadow: 0 4px 0 rgba(0, 0, 0, .35); }
.op:hover { border-color: var(--ember); }
.scale .pan .dish { position: relative; }
.opfly { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); font-size: 18px; font-weight: 700; color: var(--ember); pointer-events: none; animation: opfly 1s forwards; white-space: nowrap; }
@keyframes opfly { 0% { transform: translate(-50%, -30px); opacity: 0; } 30% { transform: translate(-50%, -14px); opacity: 1; } 100% { transform: translate(-50%, -14px); opacity: 0; } }
.coach { border-left: 4px solid var(--frost); background: var(--pine); border-radius: 10px; padding: 10px 14px; font-size: 15px; line-height: 1.45; }
.coach.hint { border-left-color: var(--ember); }
.coach.good { border-left-color: var(--aurora); }
.coach.bad { border-left-color: var(--berry); }
.coach b { color: var(--birch); }
.op.suggest { border-color: var(--ember); box-shadow: 0 4px 0 rgba(0, 0, 0, .35), 0 0 0 4px rgba(243, 181, 74, .35); animation: suggest 1.1s ease-in-out infinite; }
@keyframes suggest { 50% { transform: translateY(-3px); } }
.exsteps { display: grid; gap: 4px; background: var(--night); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.exrow { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; align-items: baseline; }
.exrow b { font-size: 18px; font-variant-numeric: tabular-nums; }
.exrow .exop { color: var(--ember); font-size: 13px; font-weight: 600; }
.exrow small { grid-column: 1 / -1; color: var(--mute); font-size: 12px; }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 3px; color: var(--mute); }
.rules b { color: var(--birch); }
.steps { display: grid; gap: 2px; font-variant-numeric: tabular-nums; color: var(--mute); font-size: 15px; }
.steps div b { color: var(--birch); font-weight: 600; }
.steps .opl { color: var(--ember); font-size: 13px; margin-left: 10px; }

/* ---------- Kast (koordinatsystem) ---------- */
.cannon { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 14px; align-items: start; }
.cannon canvas { width: 100%; height: auto; aspect-ratio: 1; max-width: 100%; background: var(--pine); border: 1px solid var(--line); border-radius: 16px; display: block; }
.aim { display: grid; gap: 10px; }
